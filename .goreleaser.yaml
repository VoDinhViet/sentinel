version: 2
project_name: sentinel

builds:
  - main: ./cmd/sentinel
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    # Fixed names (no version) so deploy/install.sh can use releases/latest/download.
    name_template: "sentinel_linux_{{ .Arch }}"
    files:
      - README.md
      - deploy/*

checksum:
  name_template: checksums.txt
