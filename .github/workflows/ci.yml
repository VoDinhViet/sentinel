name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: restic (the backup tests are skipped without it)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends restic
      - run: make test
