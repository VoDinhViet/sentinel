name: sentinel-e2e

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: e2e-pg-pass
      POSTGRES_DB: app
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30

  s3:
    # SeaweedFS S3 gateway (the minio/minio image is no longer published).
    # Signed requests need an identities file with the test credentials.
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    volumes: ["./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"]
    ports: ["127.0.0.1:59000:8333"]
