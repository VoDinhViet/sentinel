# Sentinel configuration. ${VAR} is replaced by the environment variable VAR
# (set them in /etc/sentinel/sentinel.env). A missing variable is an error.
# Quote any value that contains YAML special characters.

server_name: web-01                      # default: hostname
store: /var/lib/sentinel/state.db

alert:
  cooldown: 1h                           # re-send a still-open alert this often
  notify_success: false                  # also message after each successful backup

notifiers:                               # remove the notifiers you don't use
  telegram:
    token: "${TG_TOKEN}"                 # from @BotFather
    chat_id: "-1001234567890"
  smtp:
    host: smtp.gmail.com
    port: 587                            # 587 = STARTTLS, 465 = implicit TLS
    user: "${SMTP_USER}"
    pass: "${SMTP_PASS}"                 # Gmail: an app password
    to: [ops@example.com]
    # A server that is not this machine must offer STARTTLS (or use port 465). For a relay that cannot,
    # e.g. inside a private network, allow plaintext on purpose:
    # insecure_plaintext: true
  discord:
    webhook: "${DISCORD_WEBHOOK}"
  slack:
    webhook: "${SLACK_WEBHOOK}"

# restic repositories. Each needs its own password; losing it means losing the backups.
repositories:
  s3main:
    url: "s3:s3.amazonaws.com/my-bucket/web-01"   # MinIO/R2/Wasabi: s3:https://host/bucket/path
    password: "${RESTIC_PASSWORD}"
    env:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  gdrive:
    url: "rclone:gdrive:backups/web-01"           # "gdrive" is a remote created with `rclone config`
    password: "${RESTIC_PASSWORD}"

# A job that leaves out schedule, repositories or retention takes them from here.
# Schedules: "daily 02:00", "weekly sun 03:00", "monthly 1 04:00", "hourly :15", "every 6h",
# "manual" (only run by hand), or a cron expression such as "0 2 * * *" (server time).
defaults:
  schedule: daily 02:00
  repositories: [s3main, gdrive]
  retention: { daily: 7, weekly: 4, monthly: 6 }

jobs:
  - name: appdb
    type: postgres
    timeout: 6h              # longest one run may take (default 6h); raise it for a very large database
    postgres:
      host: localhost
      port: 5432
      user: postgres
      password: "${PGPASSWORD}"
      database: app

  # MySQL / MariaDB: needs mariadb-dump or mysqldump. The password never goes on
  # the command line (a 0600 temp file is used). Set tls: disabled if the server has no TLS.
  # - name: shopdb
  #   type: mysql
  #   schedule: daily 02:15
  #   mysql: { host: localhost, port: 3306, user: root, password: "${MYSQL_PWD}", database: shop }

  # MongoDB: needs mongodump (mongodb-database-tools); dumps one database as a gzip archive.
  # - name: crm
  #   type: mongodb
  #   schedule: daily 02:30
  #   mongodb: { host: localhost, port: 27017, user: backup, password: "${MONGO_PWD}", auth_database: admin, database: crm }

  - name: uploads
    type: files
    schedule: daily 02:30                # its own schedule and repository: these win over defaults
    paths: [/var/www/app/uploads, /etc/nginx]
    exclude: ["*.tmp", "cache/"]
    repositories: [s3main]
    retention: { daily: 7, weekly: 4 }

verify_schedule: weekly sun 04:00    # `restic check` of every repository

# Keep backups from starving the server. These are the defaults.
# resources:
#   priority: low          # low = nice 10 + lowest disk priority for restic and the dump tool; or normal
#   max_parallel: 1        # backups running at once on this machine; the others wait for a slot
#   upload_limit_kib: 0    # KiB/s per backup, 0 = no cap
# On stop (systemctl restart) the daemon lets running backups finish for this long before it
# cancels them. Keep TimeoutStopSec in deploy/sentinel.service longer than this.
# shutdown_wait: 2h

uptime:
  - name: website
    type: http
    url: https://example.com
    interval: 60s
    timeout: 10s
    expect_status: 200
    keyword: "Welcome"                   # optional: must appear in the body
    cert_expiry_days: 14                 # warn when the TLS certificate expires sooner
    fail_after: 3                        # alert after this many failures in a row
  - name: db-port
    type: tcp
    address: 10.0.0.5:5432
  - name: gateway
    type: ping
    host: 10.0.0.1
