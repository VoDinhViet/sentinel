# Sentinel configuration. ${VAR} is replaced by the environment variable VAR
# (set them in /etc/sentinel/sentinel.env). A missing variable is an error.
# Quote any value that contains YAML special characters.

server_name: web-01                      # default: hostname
store: /var/lib/sentinel/state.db

alert:
  cooldown: 1h                           # re-send a still-open alert this often
  notify_success: false                  # also message after each successful backup

notifiers:                               # remove the notifiers you don't use
  telegram:
    token: "${TG_TOKEN}"                 # from @BotFather
    chat_id: "-1001234567890"
  smtp:
    host: smtp.gmail.com
    port: 587                            # 587 = STARTTLS, 465 = implicit TLS
    user: "${SMTP_USER}"
    pass: "${SMTP_PASS}"                 # Gmail: an app password
    to: [ops@example.com]
    # A server that is not this machine must offer STARTTLS (or use port 465). For a relay that cannot,
    # e.g. inside a private network, allow plaintext on purpose:
    # insecure_plaintext: true
  discord:
    webhook: "${DISCORD_WEBHOOK}"
  slack:
    webhook: "${SLACK_WEBHOOK}"

# restic repositories. Each needs its own password; losing it means losing the backups.
repositories:
  s3main:
    url: "s3:s3.amazonaws.com/my-bucket/web-01"   # MinIO/R2/Wasabi: s3:https://host/bucket/path
    password: "${RESTIC_PASSWORD}"
    env:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  gdrive:
    url: "rclone:gdrive:backups/web-01"           # "gdrive" is a remote created with `rclone config`
    password: "${RESTIC_PASSWORD}"

# A job that leaves out schedule, repositories or retention takes them from here.
# Schedules: "daily 02:00", "weekly sun 03:00", "monthly 1 04:00", "hourly :15", "every 6h",
# "manual" (only run by hand), or a cron expression such as "0 2 * * *" (server time).
defaults:
  schedule: daily 02:00
  repositories: [s3main, gdrive]
  retention: { daily: 7, weekly: 4, monthly: 6 }

jobs:
  - name: appdb
    type: postgres
    timeout: 6h              # longest one run may take (default 6h); raise it for a very large database
    postgres:
      host: localhost
      port: 5432
      user: postgres
      password: "${PGPASSWORD}"
      database: app

  # MySQL / MariaDB: needs mariadb-dump or mysqldump. The password never goes on
  # the command line (a 0600 temp file is used). Set tls: disabled if the server has no TLS.
  # - name: shopdb
  #   type: mysql
  #   schedule: daily 02:15
  #   mysql: { host: localhost, port: 3306, user: root, password: "${MYSQL_PWD}", database: shop }

  # MongoDB: needs mongodump (mongodb-database-tools); dumps one database as a gzip archive.
  # - name: crm
  #   type: mongodb
  #   schedule: daily 02:30
  #   mongodb: { host: localhost, port: 27017, user: backup, password: "${MONGO_PWD}", auth_database: admin, database: crm }

  - name: uploads
    type: files
    schedule: daily 02:30                # its own schedule and repository: these win over defaults
    paths: [/var/www/app/uploads, /etc/nginx]
    exclude: ["*.tmp", "cache/"]
    repositories: [s3main]
    retention: { daily: 7, weekly: 4 }

verify_schedule: weekly sun 04:00    # `restic check` of every repository; this is the default, `manual` turns it off
prune_schedule: weekly sat 03:00     # `restic prune` of every repository (a backup only forgets old snapshots); this is the default, `manual` turns it off

# The one failure Sentinel cannot report itself is the daemon stopping. Give it a URL (healthchecks.io, an
# Uptime Kuma push monitor): it is requested at start and then every `every`, and the service on the other end
# alerts you when the requests stop. https only.
# heartbeat:
#   url: ${HEARTBEAT_URL}
#   every: 5m

# HTTP API of the daemon, off by default: status, jobs, snapshots, start and stop a backup (see the README).
# The token is required, even on 127.0.0.1; keep the value in the env file next to this config.
# Without tls_cert, listen on 127.0.0.1 and reach it through an SSH tunnel or a TLS reverse proxy: the token is sent without TLS.
# api:
#   listen: 127.0.0.1:9311
#   token: ${SENTINEL_API_TOKEN}
#   read_token: ${SENTINEL_API_READ_TOKEN}   # optional: a second token that can only read (GET), for a machine that watches this server
#   tls_cert: /etc/sentinel/api-cert.pem     # optional, both or neither: serve HTTPS (TLS 1.2+) instead of HTTP
#   tls_key: /etc/sentinel/api-key.pem       # read at start, so renewing the certificate needs a restart

# Report to a control plane (sentinel-server) and renew this server's certificate by itself. Run
# `sentinel agent join ...` first (sentinelctl server add <name> prints the command). Without this block the
# agent works alone. The key and certificate are kept in the agent/ directory next to `store`; `dir` moves it.
# control_plane:
#   url: "https://ctl.example.com:9320"
#   # What the control plane may ask this server to do. Everything is off until you turn it on here, the control
#   # plane cannot change it, and a change needs a restart of the daemon. Every task is also written to this
#   # machine's log.
#   allow:
#     backup: false   # start and stop the backup of a job in this file, and list its snapshots
#     doctor: false   # run `sentinel doctor`

# Watch other Sentinel servers: every `every` the daemon asks the API of each server listed in this fleet file (the
# one `sentinel fleet` reads, see the README) and sends an alert here when one cannot be reached `fail_after`
# rounds in a row. A server's own alerts are not repeated: it sends those itself.
# fleet:
#   config: /etc/sentinel/fleet.yaml
#   every: 1m
#   fail_after: 3

# Alert (Warning) when a file system Sentinel writes to has less than this share free: the state database,
# the restic cache and each local repository are always watched, disk.paths adds more. These are the defaults;
# min_free_percent: 0 turns the alert off.
# disk:
#   min_free_percent: 10
#   paths: []

# Keep backups from starving the server. These are the defaults.
# resources:
#   priority: low          # low = nice 10 + lowest disk priority for restic and the dump tool; or normal
#   max_parallel: 1        # backups running at once on this machine; the others wait for a slot
#   upload_limit_kib: 0    # KiB/s per backup, 0 = no cap
# On stop (systemctl restart) the daemon lets running backups finish for this long before it
# cancels them. Keep TimeoutStopSec in deploy/sentinel.service longer than this.
# shutdown_wait: 2h

uptime:
  - name: website
    type: http
    url: https://example.com
    interval: 60s
    timeout: 10s
    expect_status: 200
    keyword: "Welcome"                   # optional: must appear in the body
    cert_expiry_days: 14                 # warn when the TLS certificate expires sooner
    fail_after: 3                        # alert after this many failures in a row
  - name: db-port
    type: tcp
    address: 10.0.0.5:5432
  - name: gateway
    type: ping
    host: 10.0.0.1
